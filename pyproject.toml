[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acnl"
version = "0.5.0"
description = "Agentic Communication Network Layer — directory, sequenced reliable transport, and hop-count routing for agent-to-agent traffic."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guilherme", email = "guilherme.barcha@gmail.com" }]
dependencies = ["msgpack>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
security = ["cryptography>=41"]

[tool.setuptools.packages.find]
include = ["acnl_core*", "acnl_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
